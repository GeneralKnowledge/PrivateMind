[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privatebrain"
version = "0.1.0"
description = "A persistent agent whose mind is a harness² component tree that improves itself"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harness2 @ git+https://github.com/GeneralKnowledge/harness2.git",
    "gepa>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
privatebrain = "privatebrain.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/privatebrain"]
