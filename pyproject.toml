[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privatemind"
version = "0.6.0"
description = "Autonomous agent with a private trusted core, persistent executive, and extensible capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
privatemind = "privatemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/privatemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--ignore=tests/fixtures"
